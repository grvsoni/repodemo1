stages: [lint, test, scan, build]

include:
  - project: gaurav-group3/ci-templates
    ref: main
    file: templates/node-quality.yml
    inputs:
      node_version: "22"
      lint_command: "echo 'no lint configured yet'"

build:
  stage: build
  image: node:22
  script:
    - npm ci
    - npm run build
  artifacts:
    paths: [dist/]
    expire_in: 1 week
